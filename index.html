<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>TWEB - Trabalho Pratico - Gonçalo Santos & Carlos Serra</title>
    <link rel="stylesheet" href="estilos.css" type="text/css">
</head>
<body>

        <div id="form-container">
            <form id="rental-form">
                <div id="buttons-form">
                    <button id="cars">
                    
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"></path>
                        </svg>
                
                        
                        <div>Cars</div>

                    </button>

                    <button id="trucks">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path fill="currentColor" fill-rule="evenodd" d="M1 16V7a2 2 0 012-2h11.86a4 4 0 013.328 1.781L21 11a2 2 0 012 2v3h-2a3 3 0 11-6 0H8a3 3 0 11-6 0H1zm7-9h5v4H8V7zM6 7H3v4h3V7zm9 4V7.005a2 2 0 011.523.886L18.596 11H15zM4 16a1 1 0 102 0 1 1 0 00-2 0zm13 0a1 1 0 102 0 1 1 0 00-2 0z" clip-rule="evenodd"></path>
                        </svg>
                    
                        <div>Trucks</div>
                        
                    </button>

                    <button id="subscription">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18.655 7.517h-11.5L4.62 12.088l-1.674.955 3.107 1.085-.524 1.504-3.07-1.07v5.371h3.038v-1.637h1.59l.005 3.23H.864v-9.129l2.579-1.471 2.773-5.003h11.555l.884 1.594zm3.33 8.966a5.93 5.93 0 01-5.923 5.923 5.93 5.93 0 01-5.923-5.923 5.93 5.93 0 015.923-5.923 5.93 5.93 0 014.668 2.286h-1.827v1.593h4.593V9.838h-1.593v1.932a7.528 7.528 0 00-5.84-2.804c-4.145 0-7.518 3.374-7.518 7.517 0 4.144 3.373 7.517 7.517 7.517 4.143 0 7.517-3.373 7.517-7.517h-1.594zM16.86 20.12v-2.84h2.84v-1.594h-2.84v-2.84h-1.594v2.84h-2.84v1.594h2.84v2.84h1.594z"></path></svg>
                        <div>Subscription</div>

                    </button>
                

                </div>


                <div id="pickup-return-container">
                    
                    <div id="rf-booker"> 

                        <div id="pickup-return">
                            
                            <label for="pickup">Pickup & return</label>

                            <div id="rf-pickup-input">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                                <input type="text" id="pickup" name="pickup_text" placeholder="Airport, city or address">
                            </div>

                        </div>

                        <div id="plus-different-location">

                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path></svg>
                            <div id="different-location">Different return location</div>
                            

                        </div>

                    </div>
                    

                    
                    <div id="rf-date">
                        <div id="pickup-return-date">

                            <div id="rf-pickup-date">
                                
                                <label for="pickup-date">Pickup date</label>
                                
                                <div id="pickup-datetime-container">
                                    <div id="rf-pickup-date-input">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"></path></svg>
                                        <input type="text" id="pickup-date" name="pickup_text" placeholder="date pickup">
                                    </div>

                                    <input type="text" id="pickup-time" name="pickup_text" placeholder="time pickup">
                                </div>
                            
                            </div>

                            <div id="rf-return-date">
                                
                                <label for="return-date">Return date</label>
                                
                                <div id="return-datetime-container">
                                    <div id="rf-return-date-input">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"></path></svg>
                                        <input type="text" id="return-date" name="pickup_text" placeholder="return date">
                                    </div>

                                    <input type="text" id="return-time" name="pickup_text" placeholder="return time">
                                </div>
                            
                            </div>

                        </div>

                        <div id="rf-cars">
                            <button id="show-cars">Show cars</button>

                        </div>



                    </div>

                </div>


                <div id="rf-discount">Apply corporate rate</div>
            
            </form>

        </div>


        <div id="main">



            <div id="sector1">
                <div id="s1-barra-txt-topo"></div>
                
                <div id="s1-imagem">

                </div>
                
                <div id="s1-barra-txt-fundo">
                    TEXTO A ADICIONAR
                </div>
                
            </div>

                <div id="s2-cards-topo">

                    <div class="s2-card">
                        <div class="s2-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"></path>

                        </div>
                        <div class="s2-card-title">Global reach</div>

                    </div>

                    <div class="s2-card">
                        <div class="s2-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM7.5 16c-.83 0-1.5-.67-1.5-1.5S6.67 13 7.5 13s1.5.67 1.5 1.5S8.33 16 7.5 16zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5.81 10l1.04-3h10.29l1.04 3H5.81z"></path>
                            </svg>
                        </div>
                        <div class="s2-card-title">Global reach</div>
                        <div class="s2-card-txt">From high-end convertibles to premium SUVs</div>
                    </div>

                    <div class="s2-card">
                        <div class="s2-card-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path d="M1 11h4v11H1zm15-7.75C16.65 2.49 17.66 2 18.7 2 20.55 2 22 3.45 22 5.3c0 2.27-2.91 4.9-6 7.7-3.09-2.81-6-5.44-6-7.7C10 3.45 11.45 2 13.3 2c1.04 0 2.05.49 2.7 1.25zM20 17h-7l-2.09-.73.33-.94L13 16h2.82c.65 0 1.18-.53 1.18-1.18 0-.49-.31-.93-.77-1.11L8.97 11H7v9.02L14 22l8.01-3c-.01-1.1-.9-2-2.01-2z"></path>
                            </svg>
                        </div>
                        <div class="s2-card-title">Global reach</div>
                        <div class="s2-card-txt">Stress-free, trustworthy, no hidden costs</div>
                    </div>

                </div>

                    <div id="s2-img2" class="img-container">

                    <div id="s2-img5" class="img-container">
                        <img src="media/s2-img5.webp" alt="homem de fato junto a bmw cinzento">

                        <button class="btn-dot">

                    </div>
                    <div id="s3-btns-dir">
